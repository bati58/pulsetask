<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek, modern Personal Task Manager built with HTML, CSS, and Vanilla JavaScript. Stay organized with local storage persistence and quick filters.">
  <title>PulseTask — Personal Task Manager</title>
  
  <!-- Modern Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <div class="app-wrapper">
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">PulseTask</h1>
          <p class="brand-subtitle">Focus on what matters, one step at a time</p>
        </div>
      </div>

      <!-- Live progress overview -->
      <div class="progress-card" id="progress-card">
        <div class="progress-info">
          <span class="progress-label">Task Progress</span>
          <span class="progress-count" id="progress-text">0 of 0 completed</span>
        </div>
        <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
      </div>
    </header>

    <!-- Main Application Card -->
    <main class="task-card">
      <!-- Task Creation Form -->
      <form class="task-form" id="task-form" novalidate>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <input 
            type="text" 
            id="task-input" 
            class="task-input" 
            placeholder="Add a new task (e.g. Study Algorithms)..." 
            autocomplete="off" 
            maxlength="120"
            required
            aria-label="New task input"
          />
        </div>
        <select id="category-select" class="category-select" aria-label="Select task category" title="Select category">
          <option value="Personal" selected>👤 Personal</option>
          <option value="Study">📚 Study</option>
          <option value="Coding">💻 Coding</option>
          <option value="Work">💼 Work</option>
        </select>
        <input 
          type="date" 
          id="due-date-input" 
          class="date-input" 
          aria-label="Set due date (optional)"
          title="Due date (optional)"
        />
        <button type="submit" id="add-task-btn" class="btn btn-primary" aria-label="Add task">
          <span>Add Task</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Task Controls & Filters -->
      <section class="task-controls" aria-label="Task Filters and Actions">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="filter-btn active" id="filter-all" data-filter="all" role="tab" aria-selected="true">
            <span>All</span>
            <span class="badge" id="badge-all">0</span>
          </button>
          <button type="button" class="filter-btn" id="filter-active" data-filter="active" role="tab" aria-selected="false">
            <span>Active</span>
            <span class="badge" id="badge-active">0</span>
          </button>
          <button type="button" class="filter-btn" id="filter-completed" data-filter="completed" role="tab" aria-selected="false">
            <span>Completed</span>
            <span class="badge" id="badge-completed">0</span>
          </button>
        </div>

        <button type="button" class="btn-clear" id="clear-completed-btn" title="Remove all completed tasks">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear Completed</span>
        </button>
      </section>

      <!-- Category Filter Pills Bar -->
      <section class="category-filter-bar" id="category-filter-bar" aria-label="Filter tasks by category">
        <span class="filter-label">Category:</span>
        <div class="category-tabs" role="group" aria-label="Category filter options">
          <button type="button" class="cat-filter-btn active" data-category="all" aria-pressed="true">All</button>
          <button type="button" class="cat-filter-btn" data-category="Study" aria-pressed="false">📚 Study</button>
          <button type="button" class="cat-filter-btn" data-category="Coding" aria-pressed="false">💻 Coding</button>
          <button type="button" class="cat-filter-btn" data-category="Personal" aria-pressed="false">👤 Personal</button>
          <button type="button" class="cat-filter-btn" data-category="Work" aria-pressed="false">💼 Work</button>
        </div>
      </section>

      <!-- Dynamic Task List Container -->
      <section class="task-content">
        <ul class="task-list" id="task-list" aria-live="polite">
          <!-- Tasks will be dynamically injected here by script.js -->
        </ul>

        <!-- Empty State Container -->
        <div class="empty-state" id="empty-state" style="display: none;">
          <div class="empty-icon-box" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>
          <h2 class="empty-title" id="empty-title">All tasks done!</h2>
          <p class="empty-desc" id="empty-desc">You're all caught up. Take a breather or create a new goal above.</p>
        </div>
      </section>

      <!-- Footer Info Bar -->
      <footer class="card-footer">
        <span class="footer-hint">Tip: Press <kbd>Enter</kbd> to quickly add a task</span>
        <span class="footer-stats" id="footer-status-text">0 items remaining</span>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
